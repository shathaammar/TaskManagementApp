<header class="app-header">
  <h1 class="app-title">{{ 'APP.TITLE' | translate }}</h1>
  <div class="language-buttons">
    <button 
      [class.active]="languageService.getCurrentLanguage() === 'ar'"
      (click)="languageService.switchLanguage('ar')">
      العربية
    </button>
    <button 
      [class.active]="languageService.getCurrentLanguage() === 'en'"
      (click)="languageService.switchLanguage('en')">
      English
    </button>
  </div>
</header>

<main class="container">
  <div class="controls">
    <input type="text" [(ngModel)]="searchTitle"
      [placeholder]="'TASK_LIST.SEARCH_PLACEHOLDER' | translate"
      class="search-field">

    <select [(ngModel)]="selectedStatus" class="filter-select" id="status-filter">
      <option value="">{{ 'TASK_LIST.ALL_STATUS' | translate }}</option>
      <option *ngFor="let s of statuses" [value]="s">{{ 'STATUS.' + toTranslateSuffix(s) | translate }}</option>
    </select>

    <select [(ngModel)]="selectedPriority" class="filter-select" id="priority-filter">
      <option value="">{{ 'TASK_LIST.ALL_PRIORITIES' | translate }}</option>
      <option *ngFor="let p of priorities" [value]="p">{{ 'PRIORITY.' + toTranslateSuffix(p) | translate }}</option>
    </select>

    <button class="btn-add" (click)="addTask()">
      {{ 'TASK_LIST.ADD_TASK' | translate }}
    </button>
  </div>

  <div class="task-table">
    <table>
      <thead>
        <tr>
          <th>{{ 'TASK_LIST.TABLE.ID' | translate }}</th>
          <th>{{ 'TASK_LIST.TABLE.TITLE' | translate }}</th>
          <th>{{ 'TASK_LIST.TABLE.ACTIONS' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredTasks">
          <td>{{ item.id }}</td>
          <td>
            {{ item.title }}
            <div class="task-tags">
              <app-task-badge kind="status" variant="solid" [value]="item.status"></app-task-badge>
              <app-task-badge kind="priority" variant="solid" [value]="item.priority"></app-task-badge>
            </div>
          </td>
          <td class="actions">
            <button class="btn-view" (click)="onView(item)">{{ 'TASK_LIST.ACTIONS.VIEW' | translate }}</button>
            <button class="btn-edit" (click)="onEdit(item)">{{ 'TASK_LIST.ACTIONS.EDIT' | translate }}</button>
            <button class="btn-delete" (click)="onDelete(item.id)">{{ 'TASK_LIST.ACTIONS.DELETE' | translate }}</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
